// Invocation-only optional integration setup; never changes the project or release dependencies.
gradle.afterProject { p, state ->
    if (!p.plugins.hasPlugin('net.minecraftforge.gradle')) return
    def modCoordinates = [
        'io.wispforest:accessories-neoforge:1.0.0-beta.47+1.20.1',
        'dev.su5ed.sinytra.fabric-api:fabric-api-base:0.4.31+ef105b4977',
        'dev.su5ed.sinytra.fabric-api:fabric-data-attachment-api-v1:1.0.0+30ef839e77',
        'dev.su5ed.sinytra.fabric-api:fabric-entity-events-v1:1.6.0+6274ab9d77',
        'dev.su5ed.sinytra.fabric-api:fabric-object-builder-api-v1:11.1.3+2174fc8477',
        'io.github.llamalad7:mixinextras-forge:0.3.5'
    ]
    modCoordinates.each { coordinate ->
        p.dependencies.add('runtimeOnly', p.fg.deobf(coordinate)) { transitive = false }
    }
    // Endec modules remain in Accessories' nested jars; duplicating them in
    // minecraftLibrary causes duplicate module names between launcher layers.
}
