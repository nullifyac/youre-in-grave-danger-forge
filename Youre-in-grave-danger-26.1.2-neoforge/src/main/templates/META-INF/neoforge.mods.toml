modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/nullifyac/youre-in-grave-danger-forge/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
credits="Original mod by B1n-ry; NeoForge 26.1.2 port by nullifyac"
displayURL="https://www.curseforge.com/minecraft/mc-mods/youre-in-grave-dangers"
