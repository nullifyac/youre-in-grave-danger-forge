type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.yigd]]
modId="cloth_config"
type="required"
versionRange="[26.1.154,)"
ordering="AFTER"
side="BOTH"

[[dependencies.yigd]]
modId="curios"
type="optional"
versionRange="[15.0.0+26.1.2,16)"
ordering="AFTER"
side="BOTH"

[[dependencies.yigd]]
modId="travelersbackpack"
type="optional"
versionRange="[11.2.8,12)"
ordering="AFTER"
side="BOTH"
